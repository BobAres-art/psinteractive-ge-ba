name: Auto Update Master Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'topics/**'
      - 'students.json'
    branches:
      - main  # Change to master if that is your main branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Index Builder
        run: python .github/scripts/build_index.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected across repository."
          else
            git commit -m "Auto-update indices and student portals [skip ci]"
            git push
          fi
