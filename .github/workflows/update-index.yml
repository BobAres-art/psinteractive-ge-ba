name: Auto Update Master Index

on:
  push:
    paths:
      - 'topics/**'
    branches:
      - main  # Change to 'master' if your repo default branch is master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Index Builder
        run: python .github/scripts/build_index.py

      - name: Save changes to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html"
          else
            git commit -m "Auto-update root index.html [skip ci]"
            git push
          fi
